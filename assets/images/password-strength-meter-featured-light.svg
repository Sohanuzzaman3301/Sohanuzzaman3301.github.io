<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 800 450" fill="none" role="img" aria-label="Password Strength Meter — light featured image">
  <title>Password Strength Meter — Light</title>
  <rect width="800" height="450" fill="#f6f5f2"/>
  <!-- subtle grid 44px like DESIGN.md -->
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#e8e5e0" stroke-width="0.7" opacity="1"/>
    </pattern>
    <radialGradient id="glowAmber" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 80) rotate(90) scale(220 180)">
      <stop stop-color="#fbbf24" stop-opacity="0.14"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 380) rotate(90) scale(200 160)">
      <stop stop-color="#5eead4" stop-opacity="0.10"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meterFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="35%" stop-color="#a16207"/>
      <stop offset="70%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glowAmber)"/>
  <rect width="800" height="450" fill="url(#glowTeal)"/>

  <!-- main panel -->
  <rect x="56" y="40" width="688" height="370" rx="8" fill="#ffffff" stroke="#d9d5cf" stroke-width="1"/>
  <rect x="56" y="40" width="688" height="370" rx="8" fill="none" stroke="#000" stroke-opacity="0.04" stroke-width="1"/>

  <!-- header -->
  <text x="80" y="74" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.14em" fill="#5d6273">$ password-strength-meter</text>
  <text x="80" y="96" font-family="JetBrains Mono, ui-monospace, monospace" font-size="19" font-weight="800" fill="#1d2027">Password Strength Meter</text>
  <text x="80" y="114" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#454a58">zxcvbn-inspired · k-anonymity HIBP · browser-only · never transmits plaintext</text>

  <!-- status dot -->
  <circle cx="682" cy="70" r="5" fill="#166534" opacity="0.95"/>
  <circle cx="682" cy="70" r="8" fill="#166534" opacity="0.14"/>
  <text x="695" y="74" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="700" fill="#166534" text-anchor="start">ACTIVE</text>

  <!-- password field mock -->
  <rect x="80" y="134" width="360" height="42" rx="6" fill="#f6f5f2" stroke="#d9d5cf" stroke-width="1"/>
  <text x="96" y="160" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="0.22em" fill="#1d2027">••••••••••••</text>
  <text x="96" y="172" font-family="JetBrains Mono, monospace" font-size="6.5" letter-spacing="0.08em" fill="#5d6273">12 chars · upper · lower · number · symbol</text>
  <!-- shield badge in field -->
  <g transform="translate(400,145)">
    <rect x="0" y="0" width="28" height="20" rx="4" fill="#edebe7" stroke="#d9d5cf" stroke-width="0.8"/>
    <path d="M14 4.5 L19 7 V10.5 C19 13 14 16 14 16 C14 16 9 13 9 10.5 V7 L14 4.5Z" fill="none" stroke="#166534" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M11.5 10.2 L13.2 11.9 L16.8 8.3" fill="none" stroke="#166534" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- strength bar -->
  <text x="80" y="200" font-family="JetBrains Mono, monospace" font-size="7" font-weight="700" letter-spacing="0.12em" fill="#5d6273">STRENGTH</text>
  <text x="310" y="200" font-family="JetBrains Mono, monospace" font-size="7" font-weight="700" letter-spacing="0.08em" fill="#166534">STRONG · 4 / 4</text>
  <rect x="80" y="208" width="360" height="10" rx="5" fill="#edebe7"/>
  <rect x="80" y="208" width="262" height="10" rx="5" fill="url(#meterFill)"/>
  <rect x="80" y="208" width="360" height="10" rx="5" fill="none" stroke="#d9d5cf" stroke-width="0.6" opacity="0.9"/>
  <!-- tick marks -->
  <rect x="170" y="208" width="1.2" height="10" fill="#f6f5f2" opacity="0.9"/>
  <rect x="260" y="208" width="1.2" height="10" fill="#f6f5f2" opacity="0.9"/>
  <rect x="350" y="208" width="1.2" height="10" fill="#f6f5f2" opacity="0.9"/>

  <!-- metrics row -->
  <g font-family="JetBrains Mono, monospace">
    <rect x="80" y="232" width="112" height="56" rx="6" fill="#f6f5f2" stroke="#e8e5e0" stroke-width="0.8"/>
    <text x="92" y="248" font-size="6.5" font-weight="700" letter-spacing="0.1em" fill="#5d6273">ENTROPY</text>
    <text x="92" y="266" font-size="14" font-weight="800" fill="#1d2027">58<tspan font-size="8" baseline-shift="super">bits</tspan></text>
    <text x="92" y="278" font-size="6.2" fill="#5d6273">~2.8 × 10¹⁷ guesses</text>

    <rect x="204" y="232" width="112" height="56" rx="6" fill="#f6f5f2" stroke="#e8e5e0" stroke-width="0.8"/>
    <text x="216" y="248" font-size="6.5" font-weight="700" letter-spacing="0.1em" fill="#5d6273">CRACK TIME</text>
    <text x="216" y="266" font-size="11.5" font-weight="800" fill="#1d2027">3.2<tspan font-size="7" font-weight="600"> centuries</tspan></text>
    <text x="216" y="278" font-size="6.2" fill="#5d6273">offline · 10k H/s</text>

    <rect x="328" y="232" width="112" height="56" rx="6" fill="#ffffff" stroke="#166534" stroke-width="0.9"/>
    <text x="340" y="248" font-size="6.5" font-weight="700" letter-spacing="0.1em" fill="#166534">HIBP CHECK</text>
    <text x="340" y="266" font-size="10" font-weight="800" fill="#166534">✓ not pwned</text>
    <text x="340" y="278" font-size="6.2" fill="#5d6273">k-anon · prefix 5BAA6</text>
  </g>

  <!-- right entropy viz -->
  <g transform="translate(480,134)">
    <rect x="0" y="0" width="184" height="154" rx="8" fill="#f6f5f2" stroke="#e8e5e0" stroke-width="0.8"/>
    <text x="12" y="18" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="700" letter-spacing="0.1em" fill="#5d6273">ENTROPY VIZ</text>
    <!-- circular gauge -->
    <circle cx="92" cy="72" r="44" fill="none" stroke="#e8e5e0" stroke-width="6"/>
    <circle cx="92" cy="72" r="44" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="round" stroke-dasharray="202 276" transform="rotate(-90 92 72)" opacity="0.95"/>
    <text x="92" y="68" font-family="JetBrains Mono, monospace" font-size="16" font-weight="800" fill="#1d2027" text-anchor="middle">58</text>
    <text x="92" y="82" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="700" letter-spacing="0.08em" fill="#5d6273" text-anchor="middle">BITS</text>
    <text x="92" y="94" font-family="JetBrains Mono, monospace" font-size="5.8" fill="#a16207" text-anchor="middle" font-weight="700">● HIGH ENTROPY</text>
    <!-- hash prefix fragments -->
    <g font-family="JetBrains Mono, monospace" font-size="5.5" fill="#5d6273" opacity="0.85">
      <text x="12" y="122">prefix</text><text x="46" y="122" fill="#1d2027" font-weight="700">5BAA6</text><text x="78" y="122" opacity="0.6">→ range query</text>
      <text x="12" y="134" fill="#e8e5e0">— — — — — — — — — — — — — —</text>
      <text x="12" y="144" font-size="5">plaintext never leaves browser</text>
    </g>
  </g>

  <!-- bottom chips -->
  <g font-family="JetBrains Mono, monospace" font-size="6.2" font-weight="700" letter-spacing="0.06em">
    <rect x="80" y="308" width="96" height="18" rx="9" fill="#edebe7" stroke="#d9d5cf" stroke-width="0.6"/>
    <text x="128" y="320" fill="#454a58" text-anchor="middle">zxcvbn · JS</text>
    <rect x="184" y="308" width="118" height="18" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="0.7"/>
    <text x="243" y="320" fill="#0f766e" text-anchor="middle">k-anonymity ✓</text>
    <rect x="310" y="308" width="118" height="18" rx="9" fill="#ffffff" stroke="#d9d5cf" stroke-width="0.6"/>
    <text x="369" y="320" fill="#454a58" text-anchor="middle">entropy · crack time</text>
  </g>

  <!-- footer deploy line -->
  <text x="80" y="354" font-family="JetBrains Mono, monospace" font-size="7" font-weight="700" fill="#a16207">[ OK ]</text>
  <text x="110" y="354" font-family="JetBrains Mono, monospace" font-size="7" font-weight="600" fill="#5d6273">deployed to Cloudflare Pages · CI · client-side only · </text>
  <text x="440" y="354" font-family="JetBrains Mono, monospace" font-size="7" font-weight="700" fill="#0f766e">STATUS: HARDENED</text>

  <!-- subtle corner mark -->
  <text x="80" y="382" font-family="JetBrains Mono, monospace" font-size="5.5" letter-spacing="0.1em" fill="#8a90a4" opacity="0.7">SOHAN · SOC CONSOLE · 2026</text>
  <text x="684" y="382" font-family="JetBrains Mono, monospace" font-size="5.5" fill="#8a90a4" opacity="0.7" text-anchor="end">16:9 · 1200×675</text>
</svg>