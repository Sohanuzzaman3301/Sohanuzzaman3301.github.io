<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <rect width="400" height="220" fill="transparent"/>
  <!-- Wazuh Manager -->
  <rect x="30" y="60" width="80" height="50" rx="4" fill="#4ecdc4"/>
  <text x="70" y="82" font-family="monospace" font-size="9" fill="currentColor" text-anchor="middle" font-weight="700">WAZUH</text>
  <text x="70" y="96" font-family="monospace" font-size="8" fill="currentColor" text-anchor="middle" font-weight="600">MANAGER</text>
  <!-- Connection to Windows -->
  <line x1="110" y1="85" x2="160" y2="85" stroke="#4ecdc4" stroke-width="2"/>
  <text x="135" y="78" font-family="monospace" font-size="7" fill="currentColor" text-anchor="middle" opacity="0.6">FIM</text>
  <!-- Windows Endpoint -->
  <rect x="160" y="60" width="80" height="50" rx="4" fill="currentColor" opacity="0.1"/>
  <rect x="160" y="60" width="80" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
  <text x="200" y="82" font-family="monospace" font-size="9" fill="currentColor" text-anchor="middle" font-weight="700">WINDOWS</text>
  <text x="200" y="96" font-family="monospace" font-size="8" fill="currentColor" text-anchor="middle" font-weight="600" opacity="0.7">SYSMON</text>
  <!-- Connection to Kali -->
  <line x1="240" y1="85" x2="290" y2="85" stroke="#ff4d4d" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="265" y="78" font-family="monospace" font-size="7" fill="#ff4d4d" text-anchor="middle" font-weight="700">ATTACK</text>
  <!-- Kali -->
  <rect x="290" y="60" width="80" height="50" rx="4" fill="#ff6b6b"/>
  <text x="330" y="82" font-family="monospace" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">KALI</text>
  <text x="330" y="96" font-family="monospace" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="600">ATTACKER</text>
  <!-- Suricata -->
  <rect x="160" y="130" width="80" height="40" rx="4" fill="#ffe66d"/>
  <text x="200" y="155" font-family="monospace" font-size="9" fill="currentColor" text-anchor="middle" font-weight="700">SURICATA</text>
  <!-- IDS line -->
  <line x1="200" y1="110" x2="200" y2="130" stroke="#ffe66d" stroke-width="2"/>
  <text x="60" y="160" font-family="monospace" font-size="10" fill="currentColor" font-weight="600" opacity="0.6">Hydra · PowerShell · Nmap</text>
  <text x="60" y="178" font-family="monospace" font-size="10" fill="currentColor" font-weight="600" opacity="0.6">MITRE ATT&amp;CK mapped</text>
  <text x="60" y="196" font-family="monospace" font-size="10" fill="#4ecdc4" font-weight="700">STATUS: DETECTING</text>
</svg>
